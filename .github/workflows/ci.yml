name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.14t"]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --frozen --group dev
        env:
          UV_PYTHON_PREFERENCE: only-system

      - name: Add venv to PATH
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi

      # pyo3-build-config does not emit rustc-link-search for the Python libs
      # dir on Windows with actions/setup-python. Set LIB explicitly so
      # link.exe can find python3xx.lib.
      - name: Add Python libs dir to LIB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = & "${{ steps.python.outputs.python-path }}" -c "import sys; print(sys.base_prefix)"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$base\libs;$env:LIB"

      - name: Build extension
        run: maturin develop --locked

      - name: Verify free-threaded runtime stays GIL-free
        if: matrix.python-version == '3.14t'
        env:
          PYTHON_GIL: "0"
        run: python -c "import sys, yarutsk; assert not sys._is_gil_enabled()"

      - name: Core tests
        run: pytest tests/ --ignore=tests/test_yaml_suite.py -v

      - name: yaml-test-suite compliance
        run: pytest tests/test_yaml_suite.py -q --tb=short

  # ── Upcoming Python compatibility (informational) ──────────────────────────
  test-prerelease:
    name: Test (ubuntu-latest, Python 3.15-dev, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.15 prerelease
        uses: actions/setup-python@v7
        with:
          python-version: "3.15-dev"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --frozen --group dev
        env:
          UV_PYTHON_PREFERENCE: only-system

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build extension
        run: maturin develop --locked

      - name: Core tests
        run: pytest tests/ --ignore=tests/test_yaml_suite.py -q

      - name: yaml-test-suite compliance
        run: pytest tests/test_yaml_suite.py -q --tb=short

  # ── Type checking ──────────────────────────────────────────────────────────
  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --frozen --group dev
        env:
          UV_PYTHON_PREFERENCE: only-system

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Build extension
        run: maturin develop --locked

      - name: mypy
        run: mypy

  # ── Python lint ───────────────────────────────────────────────────────────
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --frozen --group dev
        env:
          UV_PYTHON_PREFERENCE: only-system

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

  # ── Rust lint ──────────────────────────────────────────────────────────────
  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: rustfmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --locked --no-fail-fast

  # ── cargo-deny (license + advisory audit) ────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          command: check

  # ── sdist smoke build (every PR) ──────────────────────────────────────────
  sdist:
    name: sdist build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: v1.15.0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and smoke-test sdist
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.tar.gz
          python tools/smoke-wheel.py

      - name: List sdist
        run: ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Build release wheels ───────────────────────────────────────────────────
  build-wheels:
    name: Wheels (${{ matrix.platform }}, Python ${{ matrix.python-version }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, ruff, typecheck, deny, sdist]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
        platform: [linux-x64, linux-arm64, macos-universal2, windows-x64, windows-arm64]
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            python-arch: x64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python-arch: arm64
          - platform: macos-universal2
            runner: macos-latest
            python-arch: arm64
          - platform: windows-x64
            runner: windows-latest
            python-arch: x64
          - platform: windows-arm64
            runner: windows-11-arm
            python-arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: wheel-${{ matrix.platform }}-python-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          architecture: "${{ matrix.python-arch }}"

      # Linux builds run inside a manylinux Docker container, so the host
      # python-path is not accessible; use the manylinux interpreter name.
      - name: Build wheels (Linux)
        if: startsWith(matrix.platform, 'linux-')
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --locked --compatibility pypi --out dist
            --interpreter python${{ matrix.python-version }}
          manylinux: "2_17"
          maturin-version: v1.15.0
          rust-toolchain: stable

      - name: Build wheels (macOS)
        if: matrix.platform == 'macos-universal2'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --locked --compatibility pypi --out dist
            --interpreter ${{ steps.python.outputs.python-path }}
            --target universal2-apple-darwin
          maturin-version: v1.15.0
          rust-toolchain: stable

      - name: Build wheels (Windows)
        if: startsWith(matrix.platform, 'windows-')
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >-
            --release --locked --compatibility pypi --out dist
            --interpreter ${{ steps.python.outputs.python-path }}
            ${{ matrix.platform == 'windows-arm64' && '--target aarch64-pc-windows-msvc' || '' }}
          maturin-version: v1.15.0
          rust-toolchain: stable

      - name: Install and smoke-test wheel
        shell: bash
        env:
          YARUTSK_EXPECT_FREE_THREADED: ${{ matrix.python-version == '3.14t' && '1' || '0' }}
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install --force-reinstall dist/*.whl
          "${{ steps.python.outputs.python-path }}" tools/smoke-wheel.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.python-version }}
          path: dist/

  # ── Publish to PyPI ────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
